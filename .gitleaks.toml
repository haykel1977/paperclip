# gitleaks configuration for paperclip.
# Truth-first (2026-08-11): Secret Scan on main was red. Every allowlist entry
# is a documented false positive or scrubbed example — NOT a mute of a live
# credential. Real secrets must still fail closed.
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "paperclip gitleaks config"

[extend]
useDefault = true

[[allowlists]]
id = "paperclip-global"
description = "Known-safe paths and placeholder values"
paths = [
  '''pnpm-lock\.yaml''',
  '''\.env\.example''',
  '''(^|/)__snapshots__/''',
  '''(^|/)(test|tests|__tests__)/''',
  '''\.(test|spec)\.(ts|tsx|js|jsx|mjs)$''',
  '''(^|/)ui/storybook-static/''',
  '''(^|/)docs/superpowers/plans/''',
  '''(^|/)doc/logs/''',
  # Validation error strings mention PEM headers; not private keys. History
  # still contains the contiguous string — path allowlist covers HEAD + past.
  '''packages/plugins/sandbox-providers/exe-dev/src/plugin\.ts$''',
]
regexes = [
  '''(?i)(example|sample|placeholder|dummy|test|fake|changeme|your[-_]?key|xxx+)''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wrong-smoke-key''',
  '''abcdefghijklmnopqrstuvwxyz0123456789''',
  '''8f884973-c29b-44e4-8ea3-6413437f8081''',
  '''00000000-0000-4000-8000-00000000000[0-9a-f]''',
  '''sk-abcdefgh1234''',
]
